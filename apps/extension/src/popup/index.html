<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Local Media Downloader</title>
    <style>
      /*
        Colors are literal tokens from DESIGN.md (ground/panel/raised/well, ink
        scale, accent, ok/crit lamps): the popup has no Tailwind, and an inline
        literal beats a dependency. The handoff buttons are the popup's one
        filled control, matching the dashboard's primary.
      */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 22rem;
        padding: 0.875rem;
        background: #0b0d10;
        color: #e8edf4;
        font:
          0.8125rem/1.5 system-ui,
          sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      h1 {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      #health {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        color: #99a3b3;
        font-size: 0.75rem;
      }
      #health-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #454c57;
      }
      #health[data-status='connected'] #health-dot {
        background: #34d399;
      }
      #health[data-status='offline'] #health-dot {
        background: #f87171;
      }
      section {
        margin-top: 0.875rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      label {
        color: #99a3b3;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #page-url {
        margin: 0;
        color: #99a3b3;
        overflow-wrap: anywhere;
      }
      #page-title {
        margin: 0;
        font-size: 0.75rem;
        color: #99a3b3;
        overflow-wrap: anywhere;
      }
      input[type='url'],
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 0.4375rem 0.5rem;
        border: 1px solid #21262e;
        border-radius: 0.5rem;
        background: #12151a;
        color: #e8edf4;
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: #075985;
      }
      input:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      button {
        padding: 0.5rem;
        border: 1px solid #21262e;
        border-radius: 0.5rem;
        background: #1a1e25;
        color: #e8edf4;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #2e343f;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      /* The handoff is the primary action: the only filled control, dark ink
         on bright sky, exactly like the dashboard's primary button. */
      #handoff,
      #manual-handoff {
        background: #38bdf8;
        border-color: transparent;
        color: #0e1116;
      }
      #handoff:hover:not(:disabled),
      #manual-handoff:hover:not(:disabled) {
        background: #0ea5e9;
        border-color: transparent;
      }
      .hint {
        margin: 0;
        color: #99a3b3;
        font-size: 0.75rem;
        overflow-wrap: anywhere;
      }
      .hint.error {
        color: #f87171;
      }
      details {
        margin-top: 0.875rem;
        color: #99a3b3;
        font-size: 0.75rem;
      }
      summary {
        cursor: pointer;
      }
      .service-row {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="brand">
        <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient
              id="lmd-mark"
              x1="6"
              y1="2"
              x2="42"
              y2="46"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#7dd3fc" />
              <stop offset=".55" stop-color="#38bdf8" />
              <stop offset="1" stop-color="#0369a1" />
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="11" fill="#0e1116" />
          <rect x=".5" y=".5" width="47" height="47" rx="10.5" fill="none" stroke="#2e343f" />
          <path
            fill="url(#lmd-mark)"
            d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
            transform="translate(0 1.5)"
          />
        </svg>
        <h1>Local Media Downloader</h1>
      </div>
      <span id="health" data-status="checking"
        ><span id="health-dot"></span><span id="health-text">Checking…</span></span
      >
    </div>

    <section>
      <label for="page-url">Current page</label>
      <p id="page-title"></p>
      <p id="page-url">Reading the current tab…</p>
      <button id="handoff" type="button" disabled>Open in Local Media Downloader</button>
      <p class="hint" id="page-hint"></p>
    </section>

    <section>
      <label for="manual-url">Paste URL</label>
      <input id="manual-url" type="url" placeholder="https://…" spellcheck="false" />
      <button id="manual-handoff" type="button" disabled>Open in Local Media Downloader</button>
    </section>

    <details>
      <summary>Service settings</summary>
      <div class="service-row">
        <input id="service-url" type="text" spellcheck="false" aria-label="Service address" />
        <button id="service-save" type="button">Save</button>
      </div>
      <p class="hint" id="service-hint">Only loopback addresses are accepted.</p>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
