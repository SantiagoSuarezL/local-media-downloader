<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Local Media Downloader</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 22rem;
        padding: 0.875rem;
        background: #0a0a0a;
        color: #e5e5e5;
        font:
          0.8125rem/1.5 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 0.875rem;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      #health {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        color: #a3a3a3;
        font-size: 0.75rem;
      }
      #health-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #525252;
      }
      #health[data-status='connected'] #health-dot {
        background: #22c55e;
      }
      #health[data-status='offline'] #health-dot {
        background: #ef4444;
      }
      section {
        margin-top: 0.875rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      label {
        color: #737373;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #page-url {
        margin: 0;
        color: #a3a3a3;
        overflow-wrap: anywhere;
      }
      #page-title {
        margin: 0;
        font-size: 0.75rem;
        color: #737373;
        overflow-wrap: anywhere;
      }
      input[type='url'],
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 0.4375rem 0.5rem;
        border: 1px solid #262626;
        border-radius: 0.375rem;
        background: #171717;
        color: #e5e5e5;
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: #525252;
      }
      button {
        padding: 0.5rem;
        border: 1px solid #262626;
        border-radius: 0.375rem;
        background: #1c1917;
        color: #fafafa;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #292524;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .hint {
        margin: 0;
        color: #a3a3a3;
        font-size: 0.75rem;
        overflow-wrap: anywhere;
      }
      .hint.error {
        color: #f87171;
      }
      details {
        margin-top: 0.875rem;
        color: #737373;
        font-size: 0.75rem;
      }
      summary {
        cursor: pointer;
      }
      .service-row {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <h1>Local Media Downloader</h1>
      <span id="health" data-status="checking"
        ><span id="health-dot"></span><span id="health-text">Checking…</span></span
      >
    </div>

    <section>
      <label for="page-url">Current page</label>
      <p id="page-title"></p>
      <p id="page-url">Reading the current tab…</p>
      <button id="handoff" type="button" disabled>Open in Local Media Downloader</button>
      <p class="hint" id="page-hint"></p>
    </section>

    <section>
      <label for="manual-url">Paste URL</label>
      <input id="manual-url" type="url" placeholder="https://…" spellcheck="false" />
      <button id="manual-handoff" type="button" disabled>Open in Local Media Downloader</button>
    </section>

    <details>
      <summary>Service settings</summary>
      <div class="service-row">
        <input id="service-url" type="text" spellcheck="false" aria-label="Service address" />
        <button id="service-save" type="button">Save</button>
      </div>
      <p class="hint" id="service-hint">Only loopback addresses are accepted.</p>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
