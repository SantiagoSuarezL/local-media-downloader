[project]
name = "local-media-downloader-api"
version = "0.1.0"
description = "FastAPI service, job scheduler and execution adapters."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "granian>=2.8.4",
    "pydantic>=2.13.5",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_media_downloader"]

[project.scripts]
lmd-api = "local_media_downloader.__main__:main"
