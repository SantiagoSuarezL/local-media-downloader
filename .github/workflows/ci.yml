name: CI

# Triggered by events, so the workflow would run all four jobs for a commit that
# only touches documentation. paths-ignore skips the run when EVERY changed file
# matches (a commit that also touches code still runs everything). Nothing in the
# build reads .md files: the packaging tests read pyproject.toml and lmd.spec.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.agent/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.agent/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install FFmpeg (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        # Pinned 9.x static build (BtbN), not apt: apt's FFmpeg is too old to
        # roundtrip animated WebP (reads 0x0 dims, decoder rejects valid
        # files) and johnvansickle static lacks libsvtav1, which the AV1
        # preset tests require. Same class of binary the bundle pins (9.0.1).
        run: |
          curl --fail --retry 3 -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz -o /tmp/ffmpeg-static.tar.xz
          tar -xf /tmp/ffmpeg-static.tar.xz -C /tmp
          sudo install /tmp/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin/ffmpeg /tmp/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
          ffmpeg -hide_banner -h encoder=libsvtav1 | head -2

      - name: Install FFmpeg (windows)
        if: matrix.os == 'windows-latest'
        # Same pinned 9.x class as ubuntu: without it the adapter tests skip
        # on Windows and only run on ubuntu.
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm build
